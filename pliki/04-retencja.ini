# Modul 4: produkcyjna konfiguracja retencji adnotacji (fragment grafana.ini).
# Lab wspolny ma te same wartosci (wartosci chartu Helm, klucz grafana.ini).
# Na wlasnej instancji testowej wstaw ten fragment zamiast wartosci z eksperymentu w Stretch cwiczenia 09.
# Puste max_age / max_annotations_to_keep = trzymaj wszystko (domyslnie).

[annotations]
# DELETE w paczkach po tyle rekordow; 100 to default
cleanupjob_batchsize = 100
# laczna dlugosc zserializowanej listy tagow jednej adnotacji (500-4096)
tags_length = 500

[annotations.dashboard]
# adnotacje z dashboard_id <> 0: dodane w panelu i z API z dashboardUID
max_age = 90d
max_annotations_to_keep = 10000

[annotations.api]
# adnotacje organizacyjne (bez dashboardu): CI, Graphite, skrypty
# nazwa sekcji myli: adnotacja z API z dashboardUID podlega [annotations.dashboard]
max_age = 90d
max_annotations_to_keep = 10000

[unified_alerting.state_history.annotations]
# historia stanu alertow, gdy [unified_alerting.state_history] backend = annotations (domyslnie)
# ustaw OBA klucze: samo max_annotations_to_keep bez max_age Grafana ignoruje
max_age = 30d
max_annotations_to_keep = 10000
