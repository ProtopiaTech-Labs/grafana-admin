; Utwardzenie provisioningu i Git Sync — fragment grafana.ini (Grafana OSS 13.2.1).
; Checklista z lekcji 11_git_sync/10-utwardzenie-provisioningu. Wartości domyślne w komentarzach "Domyślnie:".
; Każda zmiana wymaga restartu Grafany. Klucze z env: GF_<SEKCJA>_<KLUCZ>,
; np. GF_PROVISIONING_REPOSITORY_TYPES.
;
; Kolejność wdrożenia na działającej instancji:
;   1. GET /apis/provisioning.grafana.app/v0alpha1/namespaces/<ns>/repositories
;      w każdej organizacji (default, org-<id>) -> lista repozytoriów type=local.
;   2. Usuń je i odczekaj, aż znikną z listy (finalizery).
;   3. Dopiero potem zawężaj repository_types i restartuj.
;   Odwrotna kolejność zostawia repozytorium-zombie: status Ready, zapis -> 500
;   'repository type "local" is not enabled', DELETE wisi na finalizerach.

; app_mode (klucz bez sekcji, na samej górze grafana.ini) zostaw na production.
; app_mode = development włącza allow_insecure po cichu.
; Domyślnie: production

[paths]
; Prefiksy dla spec.local.path repozytoriów typu local. Separator |, ścieżki
; względne liczone od HomePath (w obrazie Docker /usr/share/grafana).
; Pusty wpis (a||b) zatrzymuje start; pojedyncze | = brak prefiksów.
; Domyślnie: devenv/dev-dashboards|conf/provisioning
; Jeden dedykowany katalog, różny od [paths] provisioning, nic innego z niego nie czyta.
; Bez repozytoriów local zostaw ten klucz i wyłącz typ local niżej.
permitted_provisioning_paths = /var/lib/grafana-local-repos

[provisioning]
; false = brak API provisioning.grafana.app (Git Sync i local).
; Klasycznego provisioningu z [paths] provisioning nie wyłącza.
; Przed wyłączeniem usuń repozytoria (jak przy local).
; Domyślnie: true
enabled = true

; Typy repozytoriów, separator |. Puste = git|github|local.
; gitlab i bitbucket tylko w Enterprise.
; Domyślnie: (puste)
repository_types = git|github

; Cele synchronizacji, separator | (nie przecinek: "folder,folderless" to jeden
; nieznany cel i każde nowe repo dostaje "sync target is not supported").
; instance = cała instancja, experimental — nie dodawaj.
; Domyślnie: folder|folderless
allowed_targets = folder|folderless

; http:// z tokenem wysyła token otwartym tekstem.
; Domyślnie: false
allow_insecure = false

; Wyjątki od blokady SSRF (loopback, RFC 1918, link-local, unspecified).
; Separator przecinek. Liczy się host, port jest ignorowany; host z listy
; przechodzi bez sprawdzania adresu, na który się rozwiązuje, i dostaje token
; przy każdym sync/fetch/push. Bez szerokich CIDR (10.0.0.0/8 otwiera całą sieć).
; Domyślnie: (puste)
allowed_git_urls = git.internal.example.com

; Limit repozytoriów na namespace (organizację). 0 = bez limitu.
; Domyślnie: 10
max_repositories = 10

; Limit zasobów na repozytorium. 0 = bez limitu.
; Dokumentacja rekomenduje do 1000 na połączenie (maks. ~1500), większe repo dziel
; na kilka połączeń z celem folderless.
; Domyślnie: 0
max_resources_per_repository = 1000

; Mniejsze spec.sync.intervalSeconds Grafana podnosi do tej wartości.
; Realny odstęp pollingu = max(intervalSeconds, resync_interval).
; Domyślnie: 10s
min_sync_interval = 60s

; Co ile kontroler sprawdza repozytoria. Brak w defaults.ini i w dokumentacji.
; Mniejsza wartość = więcej LIST-ów i zapytań do serwera Git.
; Domyślnie: 60s
; resync_interval = 60s

; Publiczny adres dla webhooków i obrazów w komentarzach PR.
; Na reverse proxy wystaw tylko:
; /apis/provisioning\.grafana\.app/v0(alpha1)?/namespaces/[^/]+/repositories/[^/]+/(webhook|render/.*)$
; Domyślnie: (puste -> [server] root_url)
; public_root_url = https://grafana.example.com

; Limit żądań webhooka na klienta (burst 2x), potem 429. 0 = wyłączony.
; Domyślnie: 0
webhook_rate_limit_rps = 5

; Nagłówek z IP klienta dla limitu webhooka. Tylko za proxy, które go nadpisuje.
; Domyślnie: (puste -> adres TCP klienta)
; webhook_trusted_ip_header = X-Real-Ip

; Po stronie Git (poza grafana.ini):
;   - token o minimalnym zakresie, osobny dla każdego repo (Gitea: write:repository;
;     repo Read only: sam odczyt),
;   - branch protection na gałęzi synchronizowanej (PR, review, bez force push),
;   - CODEOWNERS dla katalogów zespołów,
;   - wymagane podpisane commity (Grafana podpisuje swoje commity kluczem GPG, SSH albo S/MIME),
;   - repozytorium prywatne.
