apiVersion: 1
groups:
    - orgId: 1
      name: LOGIN-1m
      folder: Uczestnicy/LOGIN
      interval: 1m
      rules:
        - uid: UID
          title: LOGIN-bledy-uslug
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                datasource:
                    type: prometheus
                    uid: prometheus
                editorMode: code
                expr: |-
                    sum by (service_name) (rate(traces_spanmetrics_calls_total{k8s_namespace_name="otel", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
                    /
                    sum by (service_name) (rate(traces_spanmetrics_calls_total{k8s_namespace_name="otel", span_kind="SPAN_KIND_SERVER"}[5m]))
                hide: false
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.05
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: DASHBOARD_UID
          panelId: 2
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            __dashboardUid__: DASHBOARD_UID
            __panelId__: "2"
            summary: 'Odsetek błędów {{ $labels.service_name }}: {{ humanizePercentage $values.A.Value }}'
          labels:
            owner: LOGIN
          isPaused: false
          notification_settings:
            receiver: LOGIN-webhook
