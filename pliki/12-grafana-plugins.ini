# Modul 12: pluginy jako kod - fragment grafana.ini do walkthrough (cwiczenia 03 i 05, ⭐Stretch).
# Nie dotyczy Labu wspolnego: tam pluginy ustawia Helm (plugins: -> GF_PLUGINS_PREINSTALL_SYNC).
# Klucze i wartosci domyslne: conf/defaults.ini na tagu v13.2.1.

[plugins]
# --- Wariant A (zalecany): preinstall z pinem --------------------------------
# Instalacja w tle po starcie; blad pobrania = wpis w logu, Grafana dziala dalej.
# Pin chroni plugin w UI i w API (POST /api/plugins/<id>/install i /uninstall -> 409)
# i wycisza dla niego hasUpdate oraz check "update" w Advisorze - przeglad wersji robisz sam.
# Pin wymusza wersje przy kazdym starcie, takze downgrade
# ("Updating plugin ... from=4.0.0 to=3.11.1"). Wersja musi istniec w katalogu:
#   curl -s https://grafana.com/api/plugins/<id>/versions | jq -r '.items[].version'
preinstall = yesoreyeram-infinity-datasource@3.11.1, grafana-clock-panel@3.2.4

# --- Wariant B: preinstall_sync - tylko dla pluginow, ktorych wymaga provisioning ---
# Instalacja przed provisioningiem. Gdy plugin trzeba pobrac (brak na dysku albo
# zmieniony pin), a pobranie sie nie uda, Grafana konczy start kodem 1
# (w Kubernetesie CrashLoopBackOff). Wersja spoza katalogu:
#   [plugin.versionNotFound] yesoreyeram-infinity-datasource v3.11.3 was not returned by the Grafana.com catalog
# UI chowa Update i blokuje Uninstall, ale backendowe API sprawdza tylko liste preinstall:
# POST .../uninstall przechodzi, hasUpdate i Advisor dalej zglaszaja nowsza wersje.
;preinstall_sync = yesoreyeram-infinity-datasource@4.0.0

# Niepinowane preinstalle (w tym 13 datasource'ow i 5 app pluginow z listy domyslnej)
# aktualizuja sie przy starcie w obrebie wersji major. Domyslnie true; chart Helm ustawia false.
preinstall_auto_update = false

# Pomija ladowanie pluginu (takze core), usuwa go z obu list preinstall i chowa w katalogu.
;disable_plugins = grafana-pyroscope-app

# Allowlista niepodpisanych: dziala tylko na status unsigned, nigdy na modified.
# Wpis dla pluginu podpisanego nic nie zmienia - ale przy przyszlym bledzie podpisu
# wpusci plugin po cichu. Trzymaj pusta albo przegladaj razem z /api/plugins/errors.
allow_loading_unsigned_plugins =

# Procesy backendowe pluginow nie dostaja zmiennych srodowiskowych hosta
# (poza GF_*, proxy HTTP(S)_PROXY/NO_PROXY, SSL_CERT_FILE/SSL_CERT_DIR,
# PLUGIN_UNIX_SOCKET_DIR i ustawieniami AWS/Azure). Przywrocenie per plugin:
;forward_host_env_vars = my-org-legacy-datasource

# --- Wariant C: air-gapped ----------------------------------------------------
# Wszystkie preinstalle wylaczone (takze domyslne Drilldown i Advisor - dostarczasz je ZIP-em
# do [paths] plugins). Bundled datasource'y z obrazu pelnego zostaja (to skan katalogu, nie preinstall).
;preinstall_disabled = true
# Klucz publiczny do weryfikacji podpisow z kodu Grafany, bez pobierania co 10 dni.
;public_key_retrieval_disabled = true

[analytics]
# Air-gapped: bez prob kontaktu z grafana.com co 10 minut (inaczej "Update check failed" w logu).
;check_for_updates = false
;check_for_plugin_updates = false
;reporting_enabled = false

[grafana_com]
# Mirror katalogu (np. Artifactory zgodne z API grafana.com) - katalog w UI i preinstall
# dzialaja jak online. Klucz jest w defaults.ini, nie w dokumentacji.
;api_url = https://artifactory.example.internal/api/grafana-com

[security]
# Plugin Frontend Sandbox (public preview): tylko pluginy spoza Grafana Labs, tylko zalogowani.
;enable_frontend_sandbox_for_plugins = marcusolsson-dynamictext-panel
# CSP najpierw w trybie raportowania - obserwujesz konsole przegladarki, potem wymuszasz.
;content_security_policy_report_only = true

[navigation.app_sections]
# <plugin-id> = <ID wezla navtree> <waga>. Tylko w pliku (env nie zakoduje "-").
# "dashboards" to nie ID sekcji - poprawnie "dashboards/browse"; zly ID chowa aplikacje z menu.
;grafana-exploretraces-app = explore 5
;grafana-pyroscope-app = dashboards/browse 1
