# Application Alerts (OpenTelemetry Demo Services) - PrometheusRule for Kubernetes
# Uses RED metrics generated by Tempo metrics generator
#
# NOT DEPLOYED (left out of kustomization.yaml). The lab runs these alerts as
# Grafana-managed rules: helm_values/grafana/provisioning/alerting/platform-alerts.yaml
# (service_name, server spans, namespace otel only). This file stays as the
# Prometheus-format source for the Grafana course, module 7, exercise 12
# (import of Prometheus rules into Grafana).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: application-alerts
  namespace: monitoring
  labels:
    app: otel-demo
    prometheus: prometheus
spec:
  groups:
    - name: application_slo_alerts
      rules:
        - alert: ServiceHighErrorRate
          annotations:
            summary: Service has high error rate
            description: Service {{ $labels.service }} has {{ $value | humanizePercentage }} error rate.
          expr: |
            sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m])) by (service)
            /
            sum(rate(traces_spanmetrics_calls_total[5m])) by (service) > 0.05
          for: 5m
          labels:
            severity: critical
        - alert: ServiceHighErrorRateWarning
          annotations:
            summary: Service error rate elevated
            description: Service {{ $labels.service }} has {{ $value | humanizePercentage }} error rate.
          expr: |
            sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m])) by (service)
            /
            sum(rate(traces_spanmetrics_calls_total[5m])) by (service) > 0.01
          for: 10m
          labels:
            severity: warning
        - alert: ServiceHighLatencyP95
          annotations:
            summary: Service P95 latency is high
            description: Service {{ $labels.service }} P95 latency is {{ $value }}s.
          expr: |
            histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le, service)) > 2
          for: 5m
          labels:
            severity: warning
        - alert: ServiceHighLatencyP99
          annotations:
            summary: Service P99 latency is very high
            description: Service {{ $labels.service }} P99 latency is {{ $value }}s.
          expr: |
            histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket[5m])) by (le, service)) > 5
          for: 5m
          labels:
            severity: critical
        - alert: ServiceNoTraffic
          annotations:
            summary: Service has no traffic
            description: Service {{ $labels.service }} has received no requests in the last 10 minutes.
          expr: |
            sum(rate(traces_spanmetrics_calls_total[10m])) by (service) == 0
          for: 10m
          labels:
            severity: warning
        - alert: ServiceTrafficDrop
          annotations:
            summary: Service traffic dropped significantly
            description: Service {{ $labels.service }} traffic dropped by {{ $value | humanizePercentage }}.
          expr: |
            (
              sum(rate(traces_spanmetrics_calls_total[5m])) by (service)
              /
              sum(rate(traces_spanmetrics_calls_total[5m] offset 1h)) by (service)
            ) < 0.5
          for: 10m
          labels:
            severity: warning
    - name: application_service_alerts
      rules:
        - alert: FrontendServiceDown
          annotations:
            summary: Frontend service is down
            description: Frontend service has no running pods.
          expr: |
            (sum(kube_deployment_status_replicas_available{namespace="otel", deployment="frontend"}) or vector(0)) == 0
          for: 2m
          labels:
            severity: critical
        - alert: CheckoutServiceHighErrors
          annotations:
            summary: Checkout service has high errors
            description: Checkout service error rate is {{ $value | humanizePercentage }}.
          expr: |
            sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR", service=~".*checkout.*"}[5m]))
            /
            sum(rate(traces_spanmetrics_calls_total{service=~".*checkout.*"}[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
        - alert: PaymentServiceHighErrors
          annotations:
            summary: Payment service has high errors
            description: Payment service error rate is {{ $value | humanizePercentage }}.
          expr: |
            sum(rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR", service=~".*payment.*"}[5m]))
            /
            sum(rate(traces_spanmetrics_calls_total{service=~".*payment.*"}[5m])) > 0.01
          for: 2m
          labels:
            severity: critical
        - alert: CartServiceHighLatency
          annotations:
            summary: Cart service latency is high
            description: Cart service P95 latency is {{ $value }}s.
          expr: |
            histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{service=~".*cart.*"}[5m])) by (le)) > 1
          for: 5m
          labels:
            severity: warning
        - alert: ProductCatalogServiceHighLatency
          annotations:
            summary: Product catalog service latency is high
            description: Product catalog service P95 latency is {{ $value }}s.
          expr: |
            histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{service=~".*productcatalog.*|.*product-catalog.*"}[5m])) by (le)) > 1
          for: 5m
          labels:
            severity: warning
    - name: prometheus_alerts
      rules:
        - alert: PrometheusTargetDown
          annotations:
            summary: Prometheus target is down
            description: Target {{ $labels.job }}/{{ $labels.instance }} is down.
          expr: up == 0
          for: 5m
          labels:
            severity: warning
        - alert: PrometheusConfigReloadFailed
          annotations:
            summary: Prometheus config reload failed
            description: Prometheus {{ $labels.instance }} configuration reload failed.
          expr: prometheus_config_last_reload_successful == 0
          for: 5m
          labels:
            severity: warning
        - alert: PrometheusNotConnectedToAlertmanager
          annotations:
            summary: Prometheus not connected to Alertmanager
            description: Prometheus {{ $labels.instance }} is not connected to any Alertmanager.
          expr: prometheus_notifications_alertmanagers_discovered < 1
          for: 5m
          labels:
            severity: critical
        - alert: PrometheusRemoteWriteFailing
          annotations:
            summary: Prometheus remote write failing
            description: Prometheus {{ $labels.instance }} remote write to {{ $labels.remote_name }} is failing.
          expr: |
            rate(prometheus_remote_storage_failed_samples_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: PrometheusRemoteWriteLatencyHigh
          annotations:
            summary: Prometheus remote write latency high
            description: Prometheus {{ $labels.instance }} remote write latency is {{ $value }}s.
          expr: |
            histogram_quantile(0.99, rate(prometheus_remote_storage_sent_batch_duration_seconds_bucket[5m])) > 10
          for: 5m
          labels:
            severity: warning
        - alert: PrometheusRuleEvaluationFailures
          annotations:
            summary: Prometheus rule evaluation failures
            description: Prometheus {{ $labels.instance }} has {{ $value }} rule evaluation failures.
          expr: |
            increase(prometheus_rule_evaluation_failures_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
        - alert: AlertmanagerConfigNotSynced
          annotations:
            summary: Alertmanager config not synced
            description: Alertmanager instances have different configurations.
          expr: |
            count(count_values("config_hash", alertmanager_config_hash)) > 1
          for: 5m
          labels:
            severity: warning
        - alert: AlertmanagerFailedNotifications
          annotations:
            summary: Alertmanager failed to send notifications
            description: Alertmanager {{ $labels.instance }} failed to send {{ $value }} notifications to {{ $labels.integration }}.
          expr: |
            rate(alertmanager_notifications_failed_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
